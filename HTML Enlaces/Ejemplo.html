<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body bgcolor="#f5f5f5" text="#000000">
    <h1 align="center">Formulario de Registro</h1>
    <form method="POST" action="procesar.php">
        <table width="500" align="center" bgcolor="#ffffff" cellpadding="10" border="1" bordercolor="#cccccc">
            <tr>
                <td><label for="nombre">
                        <font color="#000000"><b>Nombre Completo:</b></font>
                    </label></td>
                <td><input type="text" id="nombre" name="nombre" maxlength="100" required></td>
            </tr>
            <tr>
                <td><label for="correo">
                        <font color="#000000"><b>Correo Electrónico:</b></font>
                    </label></td>
                <td><input type="email" id="correo" name="correo" required></td>
            </tr>
            <tr>
                <td><label for="contrasena">
                        <font color="#000000"><b>Contraseña:</b></font>
                    </label></td>
                <td><input type="password" id="contrasena" name="contrasena" minlength="8" required></td>
            </tr>
            <tr>
                <td><label for="fecha_nacimiento">
                        <font color="#000000"><b>Fecha de Nacimiento:</b></font>
                    </label></td>
                <td><input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required></td>
            </tr>
            <tr>
                <td><label for="genero">
                        <font color="#000000"><b>Género:</b></font>
                    </label></td>
                <td> <select id="genero" name="genero" required>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="no_binario">No Binario</option>
                        <option value="prefiero_no_decirlo">Prefiero no decirlo</option>
                    </select> </td>
            </tr>
            <tr>
                <td colspan="2"> <input type="checkbox" id="terminos" name="terminos" required> <label for="terminos">
                        <font color="#000000"><b>Acepto los términos y condiciones</b></font>
                    </label> </td>
            </tr>
            <tr>
                <td colspan="2" align="center"> <input type="submit" value="Registrar" bgcolor="#008000"> <input
                        type="reset" value="Reiniciar" bgcolor="#ff0000"> </td>
            </tr>
            <tr>
                <td colspan="2" align="center"> <input type="image" src="Imagenes/Registrar.jpg" alt="Registrar"width="100" height="30"> 
                    <input type="image" src="Imagenes/Reiniciar.jpg" alt="Reiniciar"width="100" height="30"> </td>
            </tr>
        </table>
    </form>
</body>

</html>
