<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body bgcolor="#f9f9f9" text="#333333">
    <form action="#" method="post">
        <table width="400" align="center" bgcolor="#ffffff" cellpadding="20" border="1" bordercolor="#dddddd">
            <tr>
                <td>
                    <h1 align="center">
                        Formulario de Registro
                    </h1>
                                    
                <fieldset>
                    <legend><strong>Datos de la Cuenta</strong></legend>

                    <label for="usuario">Usuario:</label><br>
                    <input type="text" id="usuario" name="usuario" required minlength="3" maxlength="40" placeholder="Escribe tu nombre de usuario"><br><br>

                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com"><br><br>

                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" required minlength="5" maxlength="20" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{5,20}" placeholder="Contraseña (5-20 caracteres)"><br><br>

                    <label for="confirm_password">Repetir Contraseña:</label><br>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="5" maxlength="20" placeholder="Confirma tu contraseña">
                </fieldset>

                
                <fieldset>
                    <legend><strong>Datos Personales</strong></legend>

                    <label><strong>Sexo:</strong></label><br>
                    <input type="radio" id="masculino" name="sexo" value="Masculino" required>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="femenino" name="sexo" value="Femenino" required>
                    <label for="femenino">Femenino</label>
                    <input type="radio" id="no_binario" name="sexo" value="No Binario" required>
                    <label for="no_binario">No Binario</label><br><br>

                    <label for="ciudad">Ciudad:</label><br>
                    <select id="ciudad" name="ciudad" required>
                        <option value="" disabled selected>Selecciona una ciudad</option>
                        <option value="Madrid">Madrid</option>
                        <option value="Barcelona">Barcelona</option>
                        <option value="Bilbao">Bilbao</option>
                        <option value="Málaga">Málaga</option>
                        <option value="Oporto">Oporto</option>
                        <option value="Lisboa">Lisboa</option>
                        <option value="Londres">Londres</option>
                        <option value="NY">NY</option>
                    </select><br><br>

                    <label><strong>Legalidades:</strong></label><br>
                    <input type="checkbox" id="legalidades" name="legalidades" required checked>
                    <label for="legalidades">Acepto los términos y condiciones</label>
                </fieldset>

                
                <div align="center">
                    <input type="image" src="Imagenes/Registrar.jpg" alt="Registrar" width="100" height="30">
                    <input type="image" src="Imagenes/Reiniciar.jpg" alt="Reiniciar" width="100" height="30">
                </div>
            </td>
        </tr>
    </table>
</form>
